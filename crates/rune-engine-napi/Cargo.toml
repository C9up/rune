[package]
name = "rune-engine-napi"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for ream-validate"

[lib]
crate-type = ["cdylib"]

[dependencies]
rune-engine = { path = "../rune-engine" }
napi = { version = "3", features = ["serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
